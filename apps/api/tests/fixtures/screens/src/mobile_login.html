<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;font-family:Arial,Helvetica,sans-serif}
body{width:390px;height:844px;background:#fff;color:#111;padding:0 24px}
.status{height:44px}
.back{font-size:26px;color:#0a7d5a;height:40px}
.brand{width:72px;height:72px;border-radius:18px;background:#0a7d5a;margin:24px auto 20px}
h1{text-align:center;font-size:26px;margin-bottom:6px}
.hint{text-align:center;color:#666;font-size:15px;margin-bottom:34px}
label{display:block;font-size:14px;color:#333;margin-bottom:6px}
.input{height:50px;border:1px solid #cfcfd6;border-radius:10px;padding:14px;color:#999;font-size:15px;margin-bottom:18px}
.forgot{text-align:right;color:#0a7d5a;font-size:14px;margin:-6px 0 26px}
.btn{height:52px;border-radius:12px;background:#0a7d5a;color:#fff;font-weight:700;font-size:17px;text-align:center;line-height:52px}
.or{text-align:center;color:#999;font-size:13px;margin:24px 0}
.google{height:50px;border:1px solid #cfcfd6;border-radius:12px;text-align:center;line-height:50px;font-size:15px}
.footer{position:absolute;bottom:40px;left:0;width:390px;text-align:center;font-size:14px;color:#555}
</style></head><body>
<div class="status"></div><div class="back">‹</div>
<div class="brand" data-gt="app-logo" data-gt-type="logo"></div>
<h1 data-gt="title" data-gt-box="text" data-gt-box="text" data-gt-type="heading">Welcome back</h1><p class="hint">Log in to continue to Fernleaf</p>
<label data-gt="email-label" data-gt-box="text" data-gt-box="text" data-gt-type="text">Email</label><div class="input" data-gt="email-input" data-gt-type="input">you@example.com</div>
<label data-gt="password-label" data-gt-box="text" data-gt-box="text" data-gt-type="text">Password</label><div class="input" data-gt="password-input" data-gt-type="input">••••••••</div>
<div class="forgot" data-gt="forgot-link" data-gt-box="text" data-gt-box="text" data-gt-type="link">Forgot password?</div>
<div class="btn" data-gt="login-button" data-gt-type="button">Log in</div>
<div class="or">or</div><div class="google" data-gt="google-button" data-gt-type="button">Continue with Google</div>
<div class="footer" data-gt="signup-footer" data-gt-box="text" data-gt-box="text" data-gt-type="text">New here? <b style="color:#0a7d5a">Create an account</b></div>
</body></html>
