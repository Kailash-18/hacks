<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;font-family:Arial,Helvetica,sans-serif}
body{width:1440px;height:900px;display:flex;background:#f3f5f9;color:#1d2433}
aside{width:232px;height:900px;background:#141b2d;color:#c9d1e3;padding:24px 18px}
aside .brand{font-weight:700;color:#fff;font-size:20px;margin-bottom:34px}
aside .item{padding:11px 12px;border-radius:8px;font-size:15px;margin-bottom:4px}
aside .item.on{background:#2a3555;color:#fff}
main{flex:1;padding:24px 32px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.top h1{font-size:26px}
.search{width:320px;height:40px;border:1px solid #d6dbe6;border-radius:8px;background:#fff;padding:11px;color:#9aa3b5;font-size:14px}
.avatar{width:40px;height:40px;border-radius:20px;background:#f2a65a;margin-left:16px}
.kpis{display:flex;gap:20px;margin-bottom:24px}
.kpi{flex:1;height:110px;background:#fff;border-radius:12px;padding:18px;border:1px solid #e3e7ef}
.kpi .l{color:#6b7488;font-size:14px}.kpi .v{font-size:30px;font-weight:700;margin-top:10px}
.chart{height:300px;background:#fff;border-radius:12px;border:1px solid #e3e7ef;padding:18px;margin-bottom:24px;position:relative}
.chart h2{font-size:17px}
.bars{position:absolute;bottom:22px;left:24px;right:24px;height:210px;display:flex;align-items:flex-end;gap:14px}
.bars div{flex:1;background:#5b7cfa;border-radius:4px 4px 0 0}
table{width:100%;background:#fff;border-radius:12px;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid #eef1f6}th{color:#6b7488;font-weight:600}
</style></head><body>
<aside data-gt="sidebar" data-gt-type="sidebar"><div class="brand">Orbit Ops</div>
<div class="item on">Overview</div><div class="item">Orders</div><div class="item">Customers</div><div class="item">Inventory</div><div class="item">Settings</div></aside>
<main><div class="top"><h1 data-gt="page-title" data-gt-type="heading">Overview</h1><div style="display:flex">
<div class="search" data-gt="search" data-gt-type="search">Search orders…</div><div class="avatar" data-gt="avatar" data-gt-type="avatar"></div></div></div>
<div class="kpis"><div class="kpi" data-gt="kpi-revenue" data-gt-type="card"><div class="l">Revenue</div><div class="v">$48,210</div></div>
<div class="kpi" data-gt="kpi-orders" data-gt-type="card"><div class="l">Orders</div><div class="v">1,284</div></div>
<div class="kpi" data-gt="kpi-refunds" data-gt-type="card"><div class="l">Refund rate</div><div class="v">2.1%</div></div></div>
<div class="chart" data-gt="sales-chart" data-gt-type="chart"><h2>Weekly sales</h2><div class="bars">
<div style="height:40%"></div><div style="height:55%"></div><div style="height:48%"></div><div style="height:70%"></div><div style="height:62%"></div><div style="height:85%"></div><div style="height:78%"></div></div></div>
<table data-gt="orders-table" data-gt-type="table"><tr><th>Order</th><th>Customer</th><th>Status</th><th>Total</th></tr>
<tr><td>#10421</td><td>Asha Rao</td><td>Shipped</td><td>$120.00</td></tr>
<tr><td>#10420</td><td>Leo Park</td><td>Pending</td><td>$64.50</td></tr>
<tr><td>#10419</td><td>Mina Cho</td><td>Refunded</td><td>$32.00</td></tr></table></main></body></html>
